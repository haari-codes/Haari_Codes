<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Haari_Codes | CS Companion</title>
<style>
:root {
  --purple: #803fe8;
  --dark: #38205e;
  --lavender: #f7f2ff;
  --border: #e6d8fa;
  --muted: #79678f;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Georgia, serif;
  color: var(--dark);
  background: #ffffff;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #ffffff;
  border-bottom: 1px solid var(--border);
}
.topbar {
  max-width: 1100px;
  min-height: 82px;
  margin: auto;
  padding: 12px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.brand img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #e3caff;
}
.brand-name {
  font-size: clamp(19px, 3vw, 28px);
  font-weight: bold;
  white-space: nowrap;
}
.brand-name span, .hero-title span { color: var(--purple); }
.search {
  flex: 1;
  max-width: 330px;
  margin-left: auto;
  position: relative;
}
.search input {
  width: 100%;
  padding: 12px 40px 12px 16px;
  border: 1px solid var(--purple);
  border-radius: 28px;
  outline: none;
  background: var(--purple);
  color: #ffffff;
}
.search input::placeholder {
  color: rgba(255, 255, 255, 0.8);
}
.search input:focus { border-color: var(--dark); }
.search-icon {
  position: absolute;
  right: 15px;
  top: 9px;
  font-size: 21px;
  color: #ffffff;
}
.menu-button {
  border: 0;
  background: transparent;
  color: var(--purple);
  font-size: 30px;
  cursor: pointer;
  padding: 3px 5px;
}
.menu {
  display: none;
  padding: 0 22px 14px;
  text-align: center;
}
.menu.open { display: block; }
.menu a {
  display: inline-block;
  padding: 10px 14px;
  margin: 3px;
  border-radius: 20px;
}
.menu a:hover { background: var(--lavender); }
.hero {
  min-height: calc(100vh - 150px);
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #ffffff;
}
.hero-logo {
  width: clamp(190px, 48vw, 260px);
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #e3caff;
  box-shadow: 0 8px 28px rgba(128,63,232,.12);
}
.hero-title {
  margin: 20px 0 0;
  font-size: clamp(35px, 7vw, 52px);
  line-height: 1.2;
}
.hero-buttons {
  width: min(100%, 380px);
  display: grid;
  gap: 13px;
  margin-top: 30px;
}
.hero-buttons a {
  display: block;
  border: 1px solid #dfccfa;
  border-radius: 28px;
  background: #fff;
  padding: 14px;
  font-weight: bold;
  transition: transform .2s, background .2s;
}
.hero-buttons a:first-child {
  color: white;
  background: var(--purple);
  border-color: var(--purple);
}
.hero-buttons a:hover {
  transform: translateY(-2px);
  background: var(--lavender);
  color: var(--dark);
}
.hero-buttons a:first-child:hover { background: #6d2bd1; color: white; }

.tagline {
  margin-top: 40px;
  width: 100%;
  text-align: center;
  display: block;
  color: var(--purple);
  font-size: clamp(18px, 4vw, 24px);
  font-weight: bold;
  letter-spacing: .5px;
}
footer {
  padding: 24px 16px;
  text-align: center;
  color: var(--muted);
}
@media (max-width: 600px) {
  .topbar { gap: 8px; padding: 10px 12px; min-height: 70px; }
  .brand gap: 7px;
  .brand img { width: 39px; height: 39px; }
  .brand-name { font-size: 19px; }
  .search { max-width: none; min-width: 35px; }
  .search input { padding: 10px 30px 10px 11px; font-size: 13px; }
  .search-icon { right: 9px; top: 8px; font-size: 17px; }
  .menu-button { font-size: 25px; }
}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <a class="brand" href="index.html" aria-label="Haari Codes Home">
      <img src="haari-logo.png" alt="Haari Codes logo">
      <div class="brand-name">Haari_<span>Codes</span></div>
    </a>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Search..." aria-label="Search">
      <button class="search-icon" type="submit" aria-label="Search" style="border:0;background:none;cursor:pointer">⌕</button>
    </form>
    <button class="menu-button" id="menuButton" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
  <nav class="menu" id="menu">
    <a href="courses.html">Courses</a>
    <a href="quiz.html">Quiz</a>
    <a href="error-detector.html">Error Detector</a>
    <a href="About.html">About Us</a>
  </nav>
</header>
  
<main>
<section class="hero" id="home">
  <img class="hero-logo" src="haari-logo.png" alt="Haari Codes logo">
  <h1 class="hero-title">Haari_<span>Codes</span></h1>
  <div class="hero-buttons">
    <a href="courses.html">Courses</a>
    <a href="quiz.html">Quiz</a>
    <a href="error-detector.html">Error Detector</a>
  </div>
  <div class="tagline">Learn • Practise • Build</div>
</section>
</main>

<footer>Made with ♥ by Haari_Codes</footer>

<script>
const menuButton = document.getElementById("menuButton");
const menu = document.getElementById("menu");

menuButton.addEventListener("click", function () {
  const opened = menu.classList.toggle("open");
  menuButton.setAttribute("aria-expanded", String(opened));
  menuButton.textContent = opened ? "✕" : "☰";
});

// Search mapping to redirect directly to the respective pages from index.html
document.getElementById("searchForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!query) return;

  // C Programming Lessons
  if (query.includes("intro to c") || query.includes("introduction to c") || query.includes("c introduction")) {
    location.href = "cintroduction.html";
  } else if (query.includes("variable") || query.includes("data type")) {
    location.href = "variables.html";
  } else if (query.includes("operator")) {
    location.href = "operators.html";
  } else if (query.includes("input") || query.includes("output")) {
    location.href = "input-output.html";
  } else if (query.includes("conditional") || query.includes("if")) {
    location.href = "conditional-statement.html";
  } else if (query.includes("loop")) {
    location.href = "loops.html";
  } else if (query.includes("function")) {
    location.href = "function.html";
  } else if (query.includes("array")) {
    location.href = "arrays.html";
  } else if (query.includes("string")) {
    location.href = "string.html";
  } else if (query.includes("pointer")) {
    location.href = "pointers.html";
  } else if (query.includes("structure")) {
    location.href = "structure.html";
  }
  // General Sections & Pages
  else if (query.includes("quiz")) {
    location.href = "quiz.html";
  } else if (query.includes("error detector") || query.includes("error")) {
    location.href = "error-detector.html";
  } else if (query.includes("course")) {
    location.href = "courses.html";
  } else if (query.includes("about")) {
    location.href = "about.html";
  } else {
    alert("No matching page found. Try typing a course or lesson name.");
  }
});
</script>
</body>
</html>
