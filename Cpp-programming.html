<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Programming | Haari Codes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#202938}
header{background:#111827;color:white;padding:20px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;color:#cbd5e1}
main{max-width:850px;margin:22px auto;padding:15px}
a{color:#2563eb;text-decoration:none}
.hero,.lesson,.quiz{background:white;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 4px 14px #0000000d}
.hero{border-left:5px solid #2563eb}
h2{color:#1d4ed8}
.topic{display:block;background:white;padding:17px;margin:12px 0;border-radius:10px;box-shadow:0 3px 10px #0000000a;color:#202938}
.topic small{display:block;color:#64748b;margin-top:7px}
button{border:0;background:#2563eb;color:white;padding:11px 16px;border-radius:8px;cursor:pointer;margin:5px 4px 5px 0}
button:disabled{background:#94a3b8}
.secondary{background:#475569}
pre{background:#111827;color:#a7f3d0;padding:15px;border-radius:9px;overflow:auto;white-space:pre-wrap}
#lessonArea,#quizArea{display:none}
#lessonText{line-height:1.7}
footer{text-align:center;padding:20px;background:#111827;color:#cbd5e1;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>Haari Codes</h1>
<p>CS Companion • Learn. Practise. Grow.</p>
</header>
<main>
<a href="courses.html">← Back to Courses</a>
<section class="hero">
<h2>⚡ C++ Programming</h2>
<p>Learn C++ from the basics to object-oriented programming, one lesson at a time.</p>
<p><b>10 lessons • Examples • Quick Check</b></p>
</section><section id="topicArea">
<h2>Course Lessons</h2>
<div id="topicList"></div>
</section><section class="lesson" id="lessonArea">
<p id="lessonCount"></p>
<h2 id="lessonTitle"></h2>
<div id="lessonText"></div>
<button class="secondary" id="prevBtn" onclick="moveLesson(-1)">← Previous</button>
<button id="nextBtn" onclick="moveLesson(1)">Next →</button>
<button onclick="showTopics()" class="secondary">All Topics</button>
</section><section class="quiz" id="quizArea">
<h2>🧠 Quick Check</h2>
<p id="question"></p>
<div id="options"></div>
<p id="feedback"></p>
<button id="nextQuestion" onclick="nextQ()" style="display:none">Next Question →</button>
<button class="secondary" onclick="showTopics()">Back to Lessons</button>
</section>
</main>
<footer>© 2026 Haari Codes • CS Companion</footer><script>
const lessons=[
{
title:"Introduction to C++",
text:"C++ is a general-purpose programming language used to create applications, games and system software. It supports procedural and object-oriented programming.",
code:'#include <iostream>\nusing namespace std;\nint main() {\n    cout << "Hello World!";\n    return 0;\n}',
note:"iostream provides input/output tools. main() is where program execution begins. cout displays output."
},
{
title:"Variables & Data Types",
text:"A variable stores data in memory. Every variable has a data type that determines the kind of value it can hold.",
code:'int age = 18;\nfloat mark = 92.5;\nchar grade = \'A\';\nstring name = "Haari";',
note:"int stores whole numbers, float stores decimal values, char stores a single character and string stores text. Use #include <string> for string."
},
{
title:"Operators",
text:"Operators perform calculations, comparisons and logical operations.",
code:'int a = 10, b = 3;\ncout << a + b;  // 13\ncout << a * b;  // 30\ncout << (a > b); // 1 (true)',
note:"Arithmetic operators include +, -, *, / and %. Comparison operators include ==, !=, > and <."
},
{
title:"Input & Output",
text:"Use cout to display information and cin to read input from the user.",
code:'int age;\ncout << "Enter your age: ";\ncin >> age;\ncout << "Age: " << age;',
note:"The insertion operator << sends output to cout. The extraction operator >> reads input through cin."
},
{
title:"Conditional Statements",
text:"if and else allow a program to make decisions depending on whether a condition is true or false.",
code:'int mark = 75;\nif (mark >= 90) {\n    cout << "A grade";\n} else {\n    cout << "Keep practising";\n}',
note:"Use else if when you need to check additional conditions."
},
{
title:"Loops",
text:"Loops repeat a block of code. The for loop is useful when the number of repetitions is known. while repeats while its condition remains true.",
code:'for (int i = 1; i <= 5; i++) {\n    cout << i << " ";\n}',
note:"Output: 1 2 3 4 5. Be careful to update the loop variable so that the loop can finish."
},
{
title:"Functions",
text:"A function is a reusable block of code that performs a specific task. Functions help keep programs organised.",
code:'int add(int a, int b) {\n    return a + b;\n}\n// Example call:\ncout << add(3, 4); // 7',
note:"The return type tells what kind of value a function gives back. void means the function does not return a value."
},
{
title:"Arrays & Strings",
text:"An array stores multiple values of the same type. Array indexing starts at zero. A string stores a sequence of characters.",
code:'int marks[3] = {80, 90, 95};\ncout << marks[0]; // 80\nstring name = "Haari";\ncout << name;',
note:"marks[0] is the first array element. Accessing an index outside the valid range can cause errors."
},
{
title:"Pointers",
text:"A pointer is a variable that stores the memory address of another variable.",
code:'int number = 10;\nint* ptr = &number;\ncout << *ptr; // 10',
note:"&number obtains the address of number. *ptr accesses the value stored at that address."
},
{
title:"Object-Oriented Programming",
text:"Object-oriented programming (OOP) organises code using classes and objects. A class defines a type, while an object is an instance of that class.",
code:'class Student {\npublic:\n    string name;\n};\nStudent s;\ns.name = "Haari";\ncout << s.name;',
note:"Classes can contain data and functions. OOP also includes concepts such as encapsulation, inheritance and polymorphism."
}
];

const questions=[
{q:"Which statement displays output in C++?",o:["cin","cout","input","print"],a:1},
{q:"Which data type stores a whole number?",o:["int","char","string","bool only"],a:0},
{q:"What is the first index of a C++ array?",o:["1","-1","0","10"],a:2},
{q:"Which keyword defines a class?",o:["object","define","structonly","class"],a:3},
{q:"Which operator obtains a variable's address?",o:["*","&","%","!"],a:1}
];

let current=0,qIndex=0,score=0,answered=false;
const list=document.getElementById("topicList");

lessons.forEach((lesson,i)=>{
const a=document.createElement("a");
a.className="topic";
a.href="#lessonArea";
a.innerHTML="<b>"+(i+1)+". "+lesson.title+"</b><small>Read lesson and example →</small>";
a.onclick=()=>openLesson(i);
list.appendChild(a);
});

function openLesson(i){
current=i;
document.getElementById("topicArea").style.display="none";
document.getElementById("quizArea").style.display="none";
document.getElementById("lessonArea").style.display="block";
document.getElementById("lessonCount").textContent="Lesson "+(i+1)+" of "+lessons.length;
document.getElementById("lessonTitle").textContent=lessons[i].title;
document.getElementById("lessonText").innerHTML="";
const p=document.createElement("p");
p.textContent=lessons[i].text;
const h=document.createElement("h3");
h.textContent="Code Example";
const pre=document.createElement("pre");
pre.textContent=lessons[i].code;
const note=document.createElement("p");
note.textContent=lessons[i].note;
document.getElementById("lessonText").append(p,h,pre,note);
document.getElementById("prevBtn").disabled=i===0;
document.getElementById("nextBtn").textContent=i===lessons.length-1?"Finish Lessons ✓":"Next →";
document.getElementById("lessonArea").scrollIntoView({behavior:"smooth"});
}
function moveLesson(step){
if(current===lessons.length-1&&step===1){showQuiz();return}
openLesson(Math.max(0,Math.min(lessons.length-1,current+step)));
}
function showTopics(){
document.getElementById("topicArea").style.display="block";
document.getElementById("lessonArea").style.display="none";
document.getElementById("quizArea").style.display="none";
window.scrollTo(0,0);
}
function showQuiz(){
document.getElementById("topicArea").style.display="none";
document.getElementById("lessonArea").style.display="none";
document.getElementById("quizArea").style.display="block";
qIndex=0;score=0;renderQ();
}
function renderQ(){
answered=false;
document.getElementById("feedback").textContent="";
document.getElementById("nextQuestion").style.display="none";
const q=questions[qIndex];
document.getElementById("question").textContent=(qIndex+1)+"/"+questions.length+" • "+q.q;
const options=document.getElementById("options");
options.innerHTML="";
q.o.forEach((option,i)=>{
const b=document.createElement("button");
b.className="secondary";
b.textContent=option;
b.style.display="block";
b.style.margin="9px 0";
b.onclick=()=>checkAnswer(i);
options.appendChild(b);
});
}
function checkAnswer(i){
if(answered)return;
answered=true;
const q=questions[qIndex];
if(i===q.a){score++;document.getElementById("feedback").textContent="Correct! 🎉"}
else{document.getElementById("feedback").textContent="Not quite. Correct answer: "+q.o[q.a]}
document.getElementById("options").querySelectorAll("button").forEach(b=>b.disabled=true);
const next=document.getElementById("nextQuestion");
next.style.display="inline-block";
next.textContent=qIndex===questions.length-1?"See Result":"Next Question →";
}
function nextQ(){
if(!answered)return;
if(qIndex<questions.length-1){qIndex++;renderQ();return}
document.getElementById("question").textContent="Quiz completed! Your score: "+score+"/"+questions.length;
document.getElementById("options").innerHTML="";
document.getElementById("feedback").textContent=score===questions.length?"Excellent work! 🌟":"Good attempt! Revise the lessons and try again.";
document.getElementById("nextQuestion").style.display="none";
}
</script></body>
</html>
