<main>
<a href="courses.html">← Back to Courses</a>
<h2>⚡ C++ Programming</h2>
<div class="intro">
<h3>Welcome to C++!</h3>
<p>Learn C++ step by step, from basic programming concepts to object-oriented programming.</p>
<p><b>What you'll learn:</b> Variables, operators, conditions, loops, functions, arrays and classes.</p>
</div><div id="lessons"></div>
<div id="details">
<h3 id="topicTitle"></h3>
<p id="topicText"></p>
<button onclick="closeLesson()">Close Lesson</button>
</div>
</main>
<footer>© 2026 Haari Codes • CS Companion</footer><script>
const topics=[
["Introduction to C++","C++ is a general-purpose programming language. It supports procedural and object-oriented programming."],
["Variables & Data Types","Variables store values. Common types include int for integers, float for decimal values, char for characters and string for text."],
["Operators","Operators perform operations. Examples include + for addition, - for subtraction, * for multiplication and == for comparison."],
["Input & Output","Use cout to display output and cin to receive input. Example: cout << \"Hello World\";"],
["Conditional Statements","Use if, else if and else to make decisions based on conditions."],
["Loops","for, while and do-while loops repeat a block of code."],
["Functions","Functions are reusable blocks of code that perform a particular task."],
["Arrays & Strings","Arrays store multiple values of the same type. Strings represent sequences of characters."],
["Pointers","Pointers store memory addresses. The & operator obtains an address and * can access the value through a pointer."],
["Object-Oriented Programming","OOP organizes code using classes and objects. Important concepts include encapsulation, inheritance and polymorphism."]
];

const container=document.getElementById("lessons");
topics.forEach((topic,index)=>{
const card=document.createElement("div");
card.className="lesson";
card.innerHTML="<h3>"+(index+1)+". "+topic[0]+"</h3><p>Explore this C++ topic with a simple explanation.</p><button onclick='openLesson("+index+")'>Study Topic</button>";
container.appendChild(card);
});

function openLesson(index){
document.getElementById("topicTitle").textContent=topics[index][0];
document.getElementById("topicText").textContent=topics[index][1];
document.getElementById("details").style.display="block";
document.getElementById("details").scrollIntoView({behavior:"smooth"});
}
function closeLesson(){
document.getElementById("details").style.display="none";
}
</script></body>
