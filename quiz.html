<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haari Codes | Smart Quiz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Georgia, serif;
  background: #f7f5ff;
  color: #292344;
}

header {
  text-align: center;
  margin: 10px auto 25px;
}

header h1 {
  color: #6554c0;
  margin-bottom: 6px;
}

header p {
  color: #77718e;
}

.container {
  max-width: 650px;
  margin: auto;
}

.card {
  background: white;
  border: 1px solid #e4dfff;
  border-radius: 18px;
  padding: 23px;
  box-shadow: 0 6px 20px #33226612;
}

label {
  display: block;
  margin: 14px 0 7px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 12px;
  border: 1px solid #cfc6ff;
  border-radius: 10px;
  background: white;
  color: #292344;
  font-size: 16px;
}

button {
  font-family: inherit;
  font-size: 16px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  margin-top: 15px;
}

.primary {
  background: #6b59c8;
  color: white;
  width: 100%;
}

.secondary {
  background: #eeeaff;
  color: #5141a3;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.topline {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: #70678e;
  font-size: 14px;
}

.progress {
  height: 7px;
  background: #eeeaff;
  border-radius: 20px;
  overflow: hidden;
  margin: 14px 0 22px;
}

#progressBar {
  height: 100%;
  width: 0;
  background: #7967dc;
  transition: width .2s;
}

#question {
  font-size: 21px;
  line-height: 1.5;
}

.option {
  display: block;
  text-align: left;
  width: 100%;
  margin: 10px 0;
  background: #faf9ff;
  border: 1px solid #e2ddfa;
  color: #292344;
  line-height: 1.4;
}

.option:hover:not(:disabled) {
  background: #f0edff;
  border-color: #8a79e6;
}

.option.correct {
  background: #e7f8ed;
  border-color: #49a86a;
  color: #155c2b;
}

.option.wrong {
  background: #fff0f0;
  border-color: #df7777;
  color: #8a2525;
}

#feedback {
  margin-top: 16px;
  padding: 13px;
  border-radius: 10px;
  line-height: 1.5;
  background: #f3f0ff;
}

.hidden {
  display: none;
}

#result {
  text-align: center;
}

#result h2 {
  color: #6554c0;
}

.small {
  color: #77718e;
  font-size: 14px;
  line-height: 1.5;
}

footer {
  text-align: center;
  color: #8b85a1;
  margin: 25px 0 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>haari_codes</h1>
  <p>Learn · Practise · Improve 💜</p>
</header>

<main class="container">

  <section class="card" id="setup">
    <h2>Smart Quiz</h2>
    <p>Choose a subject and test your knowledge!</p>

    <label for="topic">Choose topic</label>
    <select id="topic">
      <option value="all">All Topics</option>
      <option value="c">C Programming</option>
      <option value="cpp">C++</option>
      <option value="ds">Data Structures</option>
      <option value="sql">SQL</option>
      <option value="html">HTML</option>
    </select>

    <label for="amount">Number of questions</label>
    <select id="amount">
      <option value="5">5 Questions</option>
      <option value="10" selected>10 Questions</option>
      <option value="15">15 Questions</option>
      <option value="20">20 Questions</option>
      <option value="all">All Available Questions</option>
    </select>

    <p class="small">
      Questions and answer choices are shuffled each time.
      Correct answers can appear under A, B, C or D.
    </p>

    <button class="primary" id="startBtn">Start Quiz</button>
    <button class="secondary" onclick="location.href='index.html'">
      ← Back to Home
    </button>
  </section>

  <section class="card hidden" id="quiz">
    <div class="topline">
      <span id="questionCount">Question 1</span>
      <span id="scoreLabel">Score: 0</span>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <p class="small" id="topicLabel"></p>
    <h2 id="question"></h2>
    <div id="options"></div>

    <div id="feedback" class="hidden" aria-live="polite"></div>

    <button class="primary hidden" id="nextBtn">Next Question →</button>
  </section>

  <section class="card hidden" id="result">
    <h2>Quiz Completed! 🎉</h2>
    <p id="finalScore"></p>
    <h2 id="percentage"></h2>
    <p id="message"></p>
    <button class="primary" id="retryBtn">Try Another Quiz</button>
    <button class="secondary" onclick="location.href='index.html'">
      ← Back to Home
    </button>
  </section>

</main>

<footer>Made with 💜 by Haari Codes</footer>

const topicNames = {
  c: "C Programming",
  cpp: "C++",
  ds: "Data Structures",
  sql: "SQL",
  html: "HTML"
};

let questions = [];
let current = 0;
let score = 0;
let answered = false;

const $ = id => document.getElementById(id);

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function startQuiz() {
  const selectedTopic = $("topic").value;
  let bank = selectedTopic === "all"
    ? questionBank
    : questionBank.filter(q => q.topic === selectedTopic);

  if (bank.length === 0) {
    alert("No questions are available for this topic yet.");
    return;
  }

  bank = shuffle(bank);

  const amount = $("amount").value;
  questions = amount === "all"
    ? bank
    : bank.slice(0, Math.min(Number(amount), bank.length));

  questions = questions.map(q => ({
    ...q,
    options: shuffle(q.options)
  }));

  current = 0;
  score = 0;
  answered = false;

  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");

  showQuestion();
}

function showQuestion() {
  answered = false;

  const q = questions[current];

  $("questionCount").textContent =
    `Question ${current + 1} of ${questions.length}`;

  $("scoreLabel").textContent = `Score: ${score}`;

  $("progressBar").style.width =
    `${(current / questions.length) * 100}%`;

  $("topicLabel").textContent = topicNames[q.topic];
  $("question").textContent = q.question;
  $("options").innerHTML = "";
  $("feedback").classList.add("hidden");
  $("nextBtn").classList.add("hidden");

  q.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;

    button.addEventListener("click", () => checkAnswer(option, button));

    $("options").appendChild(button);
  });
}

function checkAnswer(selected, clickedButton) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const isCorrect = selected === q.answer;

  if (isCorrect) score++;

  document.querySelectorAll(".option").forEach(button => {
    button.disabled = true;

    const optionText = button.textContent.slice(3);

    if (optionText === q.answer) {
      button.classList.add("correct");
    }
  });

  if (!isCorrect) clickedButton.classList.add("wrong");

  $("scoreLabel").textContent = `Score: ${score}`;
  $("progressBar").style.width =
    `${((current + 1) / questions.length) * 100}%`;

  $("feedback").classList.remove("hidden");
  $("feedback").innerHTML = "";

  const heading = document.createElement("strong");
  heading.textContent = isCorrect ? "Correct! 🎉" : "Not quite!";

  const explanation = document.createElement("p");
  explanation.textContent =
    `Correct answer: ${q.answer}\n${q.explanation}`;

  $("feedback").append(heading, explanation);

  $("nextBtn").textContent =
    current === questions.length - 1 ? "See Results" : "Next Question →";

  $("nextBtn").classList.remove("hidden");
}

function nextQuestion() {
  if (!answered) return;

  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");

  const percent = Math.round((score / questions.length) * 100);

  $("finalScore").textContent =
    `You scored ${score} out of ${questions.length}.`;

  $("percentage").textContent = `${percent}%`;

  $("message").textContent =
    percent >= 80 ? "Excellent work! Keep it up! 💜" :
    percent >= 50 ? "Good effort! Practise a little more." :
    "Keep learning. Try again and improve your score!";
}

$("startBtn").addEventListener("click", startQuiz);
$("nextBtn").addEventListener("click", nextQuestion);

$("retryBtn").addEventListener("click", () => {
  $("result").classList.add("hidden");
  $("setup").classList.remove("hidden");
});

</script>
</body>
    </html>
